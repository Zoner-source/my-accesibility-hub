<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Puzzle</title>
<link rel="icon" type="image/png" sizes="32x32" href="../../../images/favicon-32.png">
<link rel="stylesheet" href="../../../shared/scan-status-badge.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="pz">
  <div id="status" class="nf-status"></div>

  <section id="pz-menu" class="nf-screen">
    <div class="nf-card pz-menu-card">
      <h1 id="pz-title" class="nf-title"></h1>
      <div id="pz-menu-list" class="nf-list"></div>
      <p class="nf-hint"></p>
    </div>
  </section>

  <section id="pz-play" class="nf-screen pz-play">
    <div class="pz-top">
      <h2 id="pz-instruction" class="pz-instruction" aria-live="polite"></h2>
      <button id="pz-pause-btn" type="button" class="nf-btn pz-pause-btn"></button>
    </div>
    <div class="pz-split">
      <div id="pz-pieces" class="pz-pieces"></div>
      <div id="pz-board" class="pz-board"></div>
    </div>
  </section>

  <section id="pz-pause" class="nf-screen">
    <div class="nf-card">
      <h2 id="pz-pause-title" class="nf-title"></h2>
      <div id="pz-pause-list" class="nf-list"></div>
    </div>
  </section>

  <section id="pz-settings" class="nf-screen">
    <div class="nf-card">
      <h2 id="pz-settings-title" class="nf-title"></h2>
      <div id="pz-settings-list" class="nf-list"></div>
    </div>
  </section>

  <section id="pz-help" class="nf-screen">
    <div class="nf-card">
      <button id="pz-help-title" type="button" class="nf-btn nf-title nf-title-btn"></button>
      <div id="pz-help-body" class="nf-help-body"></div>
      <div id="pz-help-list" class="nf-list"></div>
    </div>
  </section>
</div>

<!-- Shared hub modules, in the hub's required order, before the game. -->
<script src="../../../shared/safe-audio.js" onerror="console.warn('safe-audio.js not loaded')"></script>
<script src="../../../shared/platform.js"></script>
<script src="../../../shared/scan-status-badge.js"></script>
<script src="../../../shared/choice-scan.js"></script>
<script src="../../../shared/choice-scan-adapter.js"></script>
<script src="../../../shared/voice-manager.js" onerror="console.warn('voice-manager.js not loaded')"></script>
<script src="../../../shared/scan-manager.js" onerror="console.warn('scan-manager.js not loaded')"></script>
<script src="../../../shared/ios-audio-fix.js" onerror="console.warn('ios-audio-fix.js not loaded')"></script>

<!-- The language file comes first: game.js reads window.PZL. -->
<script src="js/lang-ro.js"></script>
<script src="js/game.js"></script>

</body>
</html>
