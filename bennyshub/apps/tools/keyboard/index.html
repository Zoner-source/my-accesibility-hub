<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tastatura lui Ben</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <main>
      <div class="textbar-container">
        <div id="textBar" class="textbar" aria-live="polite"></div>
      </div>

      <div id="keyboard" class="keyboard"></div>

      <div id="letterPredictBar" class="letterpredictbar"></div>

      <div id="predictBar" class="predictbar"></div>
    </main>
  </div>

  <!-- Settings menu overlay -->
  <div id="settingsMenu" class="settings-menu hidden">
    <div class="settings-header">
      <h2>Setări</h2>
      <div class="settings-instructions">
        <div class="instruction-row">
          <p><strong>Spațiu scurt:</strong> Avansează</p>
          <p><strong>Spațiu lung:</strong> Se deplasează înapoi</p>
        </div>
        <div class="instruction-row">
          <p><strong>Enter scurt:</strong> Selectează</p>
          <p><strong>Enter lung (buton):</strong> Mod rând</p>
          <p><strong>Enter lung (rând):</strong> Text predictiv</p>
        </div>
      </div>
    </div>
    <div id="settingsGrid" class="settings-grid">
      <button class="settings-item" data-setting="theme">
        <span class="setting-label">Temă</span>
        <span class="setting-value" id="themeValue">Implicit</span>
      </button>
      <button class="settings-item" data-setting="highlight">
        <span class="setting-label">Evidențiere</span>
        <span class="setting-value" id="highlightValue">Galben</span>
      </button>
      <button class="settings-item" data-setting="voice">
        <span class="setting-label">Voce</span>
        <span class="setting-value" id="voiceValue">Implicit</span>
      </button>
      <button class="settings-item" data-setting="tts-toggle">
        <span class="setting-label">Feedback vocal</span>
        <span class="setting-value" id="ttsToggleValue">Pornit</span>
      </button>
      <button class="settings-item" data-setting="scan-speed">
        <span class="setting-label">Viteză scanare</span>
        <span class="setting-value" id="scanSpeedValue">Medie</span>
      </button>
      <button class="settings-item" data-setting="auto-scan">
        <span class="setting-label">Scanare automată</span>
        <span class="setting-value" id="autoScanValue">Pornit</span>
      </button>
      <button class="settings-item" data-setting="volume-up">
        <span class="setting-label">Volum sus</span>
        <span class="setting-value">Crește volumul</span>
      </button>
      <button class="settings-item" data-setting="volume-down">
        <span class="setting-label">Volum jos</span>
        <span class="setting-value">Scade volumul</span>
      </button>
      <button class="settings-item" data-setting="close">
        <span class="setting-label">Închide setările</span>
        <span class="setting-value">Ieși din setări<br><small style="font-size: 0.6em; opacity: 0.9; margin-top: 0.5em; display: block;">Sfat: Spune textul de 3 ori pentru a-l salva la predicții</small></span>
      </button>
    </div>
  </div>

  <script>
    // Shared managers are loaded below - no inline initialization needed
    // Voice manager and scan manager self-initialize on load
  </script>
  
  <!-- Electron Bridge for iframe API access -->
  <script src="../../../shared/electron-bridge.js"></script>
  
  <!-- Shared Managers (Relative to apps/tools/keyboard/) -->
  <script src="../../../shared/voice-manager.js"></script>
  <script src="../../../shared/ios-audio-fix.js"></script>
  <script src="../../../shared/scan-manager.js"></script>
  
  <script src="predictions.js"></script>
  <script src="app.js"></script>
</body>
</html>
